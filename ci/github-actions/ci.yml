# Fast sanity gate: JS parses, web + android artifacts consistent, dist builds.
name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate artifacts
        run: npm test

      - name: Build dist
        run: npm run build
